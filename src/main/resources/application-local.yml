spring:
  application:
    name: halloween-candy-counter

  datasource:
    url: jdbc:h2:mem:candydb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8080

logging:
  level:
    com.halloween: DEBUG

admin:
  token: dev-admin-token
  settings-token: dev-settings-token
