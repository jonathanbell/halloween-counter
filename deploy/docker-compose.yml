# Production stack for halloween-counter.jonathanbell.ca
#
# Three services on one Ubuntu box:
#   caddy    - TLS termination (automatic Let's Encrypt), reverse proxy
#   app      - the Spring Boot candy counter (image built locally, shipped
#              via docker save/load or a registry - see docs/deployment.md)
#   postgres - the database, volume-backed, reachable only on the compose
#              network (no published port, never exposed to the internet)
#
# Secrets come from ./.env (copy .env.example). Full runbook:
# docs/deployment.md

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: candy-counter:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/candy?tcpKeepAlive=true
      DATABASE_USER: candy_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in deploy/.env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in deploy/.env}
      SETTINGS_TOKEN: ${SETTINGS_TOKEN:?set SETTINGS_TOKEN in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: candy
      POSTGRES_USER: candy_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candy_user -d candy"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:
