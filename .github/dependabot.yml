version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Conventional commits, stated rather than guessed from history:
    # build(deps): ... and build(deps-dev): ...
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    # Let a fresh release prove itself before it can be auto-merged.
    # Security updates skip the wait.
    cooldown:
      default-days: 7
    # Minor and major only: patch bumps are noise. Security updates ignore
    # this and arrive for any version.
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    # typescript-eslint caps TypeScript below 6.1, so 7 cannot install. Drop
    # this once typescript-eslint supports it.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # No test renders the 3D scene, so these always wait for a human.
      three:
        patterns:
          - three
          - "@types/three"
          - "@react-three/*"
      minor:
        applies-to: version-updates
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # ci(deps): ...
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
