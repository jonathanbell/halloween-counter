<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Halloween Counter Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/primitives.css" />
  <style>
    /* Page-specific only - cards, pills, readouts and tabs come from
       primitives.css, the same file the React app links. */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background:
        radial-gradient(60% 40% at 18% 12%, rgba(255, 107, 53, 0.11), transparent 70%),
        radial-gradient(52% 34% at 88% 82%, rgba(155, 89, 182, 0.11), transparent 70%),
        var(--gradient-page);
      min-height: 100dvh;
    }

    .statusbar { display: flex; justify-content: flex-end; padding: var(--space-4) var(--space-4) 0; }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      /* Sides only: a shorthand here would zero .page-end's bottom gutter */
      padding-inline: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .counter-display { text-align: center; }

    .count-label {
      font-size: var(--text-xs);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-text-dim);
    }

    .count-value { font-size: 112px; margin: var(--space-2) 0; }

    .candy-info {
      display: flex;
      border-top: 1px solid var(--color-hairline-strong);
      padding-top: var(--space-4);
      margin-top: var(--space-4);
    }

    .candy-stat { flex: 1; }
    .candy-stat-value { font-size: var(--text-xl); }

    .candy-stat-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--color-text-dim);
      margin-top: 2px;
    }

    /* The one control used all night, one-handed, in the dark - so it is
       deliberately the largest target on the screen. */
    .increment-button {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 248px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-lg);
      color: var(--color-bg);
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 10px 40px var(--color-accent-glow);
      cursor: pointer;
    }

    .increment-button:disabled { opacity: 0.5; cursor: default; }
    .increment-button:active:not(:disabled) { transform: scale(0.98); }
    .increment-button.animating { animation: buttonPulse 0.6s ease; }
    .button-icon { font-size: 56px; }

    /* Held up to a visitor's phone; the SVG carries its own white quiet zone */
    .home-qr { text-align: center; }

    .home-qr img {
      display: block;
      width: 100%;
      max-width: 240px;
      margin: var(--space-3) auto 0;
      border-radius: var(--radius-sm);
    }

    @keyframes buttonPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      transform: scale(0);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    .error-message {
      position: fixed;
      left: 50%;
      bottom: calc(56px + var(--space-5) + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(400px, calc(100% - 2 * var(--space-4)));
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }

    .error-message.show { opacity: 1; }

    /* Floats over the QR code, so it gets a solid red instead of the shared
       faint tint. 70% keeps bone-white text at ~7:1 */
    .message.error-message {
      background: color-mix(in srgb, var(--color-danger) 70%, var(--color-bg));
      box-shadow: var(--shadow-card);
    }

    .token-missing { text-align: center; padding: var(--space-7) var(--space-4); }

    @media (max-height: 700px) {
      .count-value { font-size: 84px; }
      .increment-button { min-height: 180px; }
      .button-icon { font-size: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .increment-button.animating, .ripple { animation: none; }
    }
  </style>
</head>
<body>
  <div class="statusbar">
    <span class="pill">
      <span class="dot warn" id="statusIndicator"></span>
      <span id="statusText">Connecting…</span>
    </span>
  </div>

  <h1 class="page-title">🎃 Counter Remote</h1>
  <div class="rule"><i></i><b></b><i></i></div>

  <div class="container page-end">
    <div class="card counter-display">
      <div class="count-label">Trick-or-treaters</div>
      <div class="count-value readout" id="countValue">0</div>

      <div class="candy-info">
        <div class="candy-stat">
          <div class="candy-stat-value readout plain" id="candyRemaining">0</div>
          <div class="candy-stat-label">Candy left</div>
        </div>
        <div class="candy-stat">
          <div class="candy-stat-value readout plain" id="totalCandy">0</div>
          <div class="candy-stat-label">Total candy</div>
        </div>
      </div>
    </div>

    <button class="increment-button" id="incrementButton">
      <span class="button-icon" aria-hidden="true">👻</span>
      <span>Add Visitor</span>
    </button>

    <div class="card home-qr">
      <div class="count-label">Scan to watch the count or play</div>
      <img src="/qr/home-qr.svg" alt="QR code linking to the candy counter home page">
    </div>
  </div>

  <div class="message error error-message" id="errorMessage"></div>

  <script src="/admin.js"></script>
  <script>
    // Token from the QR code URL, or cached from an earlier scan this session
    const token = AdminChrome.requireToken('halloweenAdminToken', 'admin');
    AdminChrome.renderTabs('remote');

    const YEAR = 2026;

    if (!token) throw new Error('missing token');

    let eventSource = null;
    let currentCount = 0;
    let initialCandyCount = 300;

    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const countValue = document.getElementById('countValue');
    const candyRemaining = document.getElementById('candyRemaining');
    const totalCandy = document.getElementById('totalCandy');
    const incrementButton = document.getElementById('incrementButton');
    const errorMessage = document.getElementById('errorMessage');

    const STATUS_DOT = { connected: 'ok', connecting: 'warn', disconnected: 'bad' };

    // Same labels as settings.html: "Offline" when the backend is unreachable,
    // otherwise the status, e.g. "HTTP 401" for a stale token.
    function failureLabel(error) {
      return error instanceof TypeError ? 'Offline' : error.message;
    }

    function updateStatus(status) {
      statusIndicator.className = 'dot ' + STATUS_DOT[status];
      statusText.textContent = status === 'connected' ? 'Connected' :
        status === 'disconnected' ? 'Disconnected' : 'Connecting…';
    }

    function updateDisplay() {
      countValue.textContent = currentCount;
      candyRemaining.textContent = Math.max(0, initialCandyCount - currentCount);
      totalCandy.textContent = initialCandyCount;
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 3000);
    }

    function connectSSE() {
      updateStatus('connecting');
      eventSource = new EventSource('/api/events');

      // Resync on every (re)connect: counts sent while the stream was down
      // (a locked phone) never reached this page
      eventSource.onopen = () => {
        updateStatus('connected');
        fetchState();
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'increment') {
            currentCount = data.total;
            // Settings changes ride along on count messages
            if (typeof data.initialCandyCount === 'number') {
              initialCandyCount = data.initialCandyCount;
            }
            updateDisplay();
          }
        } catch (e) {
          console.error('SSE parse error:', e);
        }
      };

      eventSource.onerror = () => {
        updateStatus('disconnected');
        eventSource.close();
        setTimeout(connectSSE, 3000);
      };
    }

    // Public endpoint
    function fetchState() {
      fetch(`/api/state?year=${YEAR}`)
        .then(r => r.json())
        .then(state => {
          currentCount = state.currentCount;
          initialCandyCount = state.initialCandyCount;
          updateDisplay();
        })
        .catch(e => console.error('state fetch failed:', e));
    }

    // The button never waits on this: an increment is a plain POST, so a
    // phone fresh off the lock screen can tap while the stream reconnects
    connectSSE();
    fetchState();

    incrementButton.addEventListener('click', async (e) => {
      const button = e.currentTarget;
      const rect = button.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = '40px';
      ripple.style.left = (e.clientX - rect.left - 20) + 'px';
      ripple.style.top = (e.clientY - rect.top - 20) + 'px';
      button.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      button.classList.add('animating');
      setTimeout(() => button.classList.remove('animating'), 600);

      // Optimistic update
      currentCount += 1;
      updateDisplay();

      try {
        const response = await fetch('/api/counter', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ year: YEAR })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (error) {
        console.error('Increment failed:', error);
        showError(`⚠️ Add failed - ${failureLabel(error)}`);
        currentCount -= 1;
        updateDisplay();
      }
    });

    // Prevent zoom on double tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, false);

    incrementButton.addEventListener('touchstart', () => {
      if ('vibrate' in navigator) navigator.vibrate(10);
    });
  </script>
</body>
</html>
