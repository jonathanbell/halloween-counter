<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Counter Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/primitives.css" />
  <style>
    /* Page-specific only - cards, buttons, fields and tabs come from
       primitives.css, the same file the React app links. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background:
        radial-gradient(60% 40% at 18% 12%, rgba(255, 107, 53, 0.11), transparent 70%),
        radial-gradient(52% 34% at 88% 82%, rgba(155, 89, 182, 0.11), transparent 70%),
        var(--gradient-page);
      min-height: 100dvh;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      /* Sides only: a shorthand here would zero .page-end's bottom gutter */
      padding-inline: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .sec-head {
      margin-bottom: var(--space-3);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-text-dim);
    }

    .values { display: flex; flex-direction: column; gap: 10px; }

    .value {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--text-sm);
    }

    .value span:first-child { color: var(--color-text-dim); }
    .value span:last-child { font-size: var(--text-lg); }

    form { display: flex; flex-direction: column; gap: var(--space-4); }
    .form-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .button-group { display: flex; gap: var(--space-3); }
    .button-group .btn { flex: 1; }

    .message:empty { display: none; }

    .token-missing { text-align: center; padding: var(--space-7) var(--space-4); }

    .candy-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .candy-row { display: flex; align-items: center; gap: var(--space-3); }
    .candy-fields { flex: 1; min-width: 0; }
    .candy-remove { padding: 0 var(--space-4); }

    .candy-thumb {
      width: var(--space-7);
      height: var(--space-7);
      flex-shrink: 0;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1 class="page-title">🎃 Settings</h1>
  <div class="rule"><i></i><b></b><i></i></div>

  <div class="container page-end">
    <div class="card" id="currentValues">
      <h3 class="sec-head">Current values</h3>
      <div class="values">
        <div class="value">
          <span>Current count</span>
          <span class="readout" id="currentCountDisplay">Loading…</span>
        </div>
        <div class="value">
          <span>Initial candy count</span>
          <span class="readout" id="initialCandyDisplay">Loading…</span>
        </div>
        <div class="value">
          <span>Candy remaining</span>
          <span class="readout" id="candyRemainingDisplay">Loading…</span>
        </div>
      </div>
    </div>

    <form id="settingsForm">
      <div class="form-group field">
        <label for="currentTotal">Set total count</label>
        <input
          type="number"
          id="currentTotal"
          name="currentTotal"
          min="0"
          placeholder="Override the running total"
        >
      </div>

      <div class="form-group field">
        <label for="initialCandyCount">Initial candy count</label>
        <input
          type="number"
          id="initialCandyCount"
          name="initialCandyCount"
          min="1"
          placeholder="Total candy pieces available"
        >
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Update Settings</button>
      </div>
    </form>

    <div id="message" class="message"></div>

    <div class="card">
      <h3 class="sec-head">🍫 Favorite candy</h3>
      <div class="candy-list" id="candyList"></div>
      <div class="button-group">
        <button type="button" class="btn btn-ghost" id="addCandyBtn">+ Add candy</button>
        <button type="button" class="btn btn-primary" id="saveCandyBtn">Save candy</button>
      </div>
      <div id="candyMessage" class="message" style="margin-top: var(--space-3);"></div>
    </div>
  </div>

  <script src="/admin.js"></script>
  <script>
    // Token from the QR code URL, or cached from an earlier scan this session
    const token = AdminChrome.requireToken('halloweenSettingsToken', 'settings');
    AdminChrome.renderTabs('settings');

    const YEAR = 2026;

    if (!token) throw new Error('missing token');

    // A rejected fetch means the backend is unreachable (`npm run dev` alone
    // is not enough - Spring Boot must be on :8080); anything else already
    // carries its status, e.g. "HTTP 401" for a stale token.
    function failureLabel(error) {
      return error instanceof TypeError ? 'Offline' : error.message;
    }

    async function loadCurrentState() {
      try {
        const response = await fetch(`/api/settings?year=${YEAR}&token=${encodeURIComponent(token)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const state = await response.json();

        document.getElementById('currentCountDisplay').textContent = state.currentTotal;
        document.getElementById('initialCandyDisplay').textContent = state.initialCandyCount;
        document.getElementById('candyRemainingDisplay').textContent = state.candyRemaining;

        document.getElementById('initialCandyCount').value = state.initialCandyCount;
      } catch (error) {
        console.error('Error loading settings:', error);
        const label = failureLabel(error);
        document.getElementById('currentCountDisplay').textContent = label;
        document.getElementById('initialCandyDisplay').textContent = label;
        document.getElementById('candyRemainingDisplay').textContent = label;
      }
    }

    loadCurrentState();

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const totalInput = document.getElementById('currentTotal').value;
      const candyInput = document.getElementById('initialCandyCount').value;

      const payload = { year: YEAR };
      if (totalInput !== '') payload.currentTotal = parseInt(totalInput);
      if (candyInput !== '') payload.initialCandyCount = parseInt(candyInput);

      const messageEl = document.getElementById('message');

      try {
        const response = await fetch('/api/settings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const state = await response.json();
          messageEl.className = 'message success';
          messageEl.textContent = '✅ Settings updated successfully!';

          document.getElementById('currentCountDisplay').textContent = state.currentTotal;
          document.getElementById('initialCandyDisplay').textContent = state.initialCandyCount;
          document.getElementById('candyRemainingDisplay').textContent = state.candyRemaining;
          document.getElementById('currentTotal').value = '';

          setTimeout(() => {
            messageEl.className = 'message';
            messageEl.textContent = '';
          }, 3000);
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (error) {
        messageEl.className = 'message error';
        messageEl.textContent = `⚠️ Update failed - ${failureLabel(error)}`;
        console.error('Error:', error);

        setTimeout(() => {
          messageEl.className = 'message';
          messageEl.textContent = '';
        }, 5000);
      }
    });

    // Favorite-candy list. Rows keep their server id in data-id so votes
    // survive a rename; new rows have none and the server slugs one.
    // Built with value/textContent, never innerHTML
    const candyList = document.getElementById('candyList');
    const candyMessage = document.getElementById('candyMessage');

    function addCandyRow(option = { id: null, label: '', imageUrl: null }) {
      const row = document.createElement('div');
      row.className = 'candy-row';
      if (option.id) row.dataset.id = option.id;

      const thumb = document.createElement('img');
      thumb.className = 'candy-thumb';
      thumb.alt = '';

      const fields = document.createElement('div');
      fields.className = 'field candy-fields';

      const label = document.createElement('input');
      label.className = 'candy-label';
      label.placeholder = 'Candy name';
      label.setAttribute('aria-label', 'Candy name');
      label.maxLength = 50;
      label.value = option.label;

      const url = document.createElement('input');
      url.className = 'candy-url';
      url.type = 'url';
      url.placeholder = 'https://… image (optional)';
      url.setAttribute('aria-label', 'Image URL');
      url.value = option.imageUrl ?? '';

      // Live preview, so a dead or hotlink-blocked image shows before saving
      const preview = () => {
        const src = url.value.trim();
        thumb.style.visibility = src ? 'visible' : 'hidden';
        if (src) thumb.src = src;
      };
      url.addEventListener('input', preview);
      preview();

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'btn btn-ghost candy-remove';
      remove.textContent = '✕';
      remove.setAttribute('aria-label', 'Remove candy');
      remove.addEventListener('click', () => row.remove());

      fields.append(label, url);
      row.append(thumb, fields, remove);
      candyList.append(row);
      return label;
    }

    async function loadCandy() {
      try {
        const response = await fetch(`/api/vote/options?year=${YEAR}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        (await response.json()).forEach(option => addCandyRow(option));
      } catch (error) {
        candyMessage.className = 'message error';
        candyMessage.textContent = `⚠️ Could not load candy - ${failureLabel(error)}`;
      }
    }

    loadCandy();

    document.getElementById('addCandyBtn').addEventListener('click', () => addCandyRow().focus());

    document.getElementById('saveCandyBtn').addEventListener('click', async () => {
      const options = [...candyList.querySelectorAll('.candy-row')].map(row => ({
        id: row.dataset.id ?? null,
        label: row.querySelector('.candy-label').value,
        imageUrl: row.querySelector('.candy-url').value || null,
      }));

      try {
        const response = await fetch('/api/settings/candy-options', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ year: YEAR, options })
        });
        // The server's 400 says which row is wrong, e.g. "Row 3: image URL must start with https://"
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error ?? `HTTP ${response.status}`);

        // Re-render with the server's ids so the next save keeps them
        candyList.replaceChildren();
        body.forEach(option => addCandyRow(option));
        candyMessage.className = 'message success';
        candyMessage.textContent = `✅ Saved ${body.length} candies. Phones pick it up on reload.`;
      } catch (error) {
        candyMessage.className = 'message error';
        candyMessage.textContent = `⚠️ Save failed - ${failureLabel(error)}`;
      }
    });
  </script>
</body>
</html>
